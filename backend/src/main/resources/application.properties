spring.application.name=login

# Carrega o .env da raiz do backend (variáveis de ambiente do sistema têm prioridade)
spring.config.import=optional:file:.env[.properties]

logging.level.org.springframework.web=DEBUG

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


api.security.token.secret=${JWT_SECRET}
api.security.token.expiration=30m

api.security.refresh.token.secret=${JWT_REFRESH_SECRET}
api.security.refresh.token.expiration=7d

api.security.cors.allowed-origins=http://localhost:4200

google.client-id=${GOOGLE_CLIENT_ID}


app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}


mail.origin={http://localhost:4200}
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
